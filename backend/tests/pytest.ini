[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    auth: marks tests related to authentication
    translation: marks tests related to translation functionality
    jobs: marks tests related to job management
    api: marks tests as API tests
    smoke: Marks tests as smoke tests (basic end-to-end functionality)