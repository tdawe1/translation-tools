[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Custom markers
markers =
    smoke: Marks tests as smoke tests for quick verification
    slow: Marks tests as slow performance tests
    integration: Marks tests as integration tests
    auth: Marks tests related to authentication
    jobs: Marks tests related to job processing
    api: Marks tests as API endpoint tests
    unit: Marks tests as unit tests

# Minimum Python version
minversion = 6.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:distutils
    ignore::UserWarning:DEBUG mode.*SECRET_KEY
    ignore::UserWarning:DEBUG mode.*OPENAI_API_KEY

# Test environment variables
env =
    PYTEST_RUNNING=1
    DATABASE_URL=sqlite:///:memory:
    LOG_LEVEL=WARNING