name: DOCX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx python-docx defusedxml lxml jsonschema

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Run smoke test
      run: |
        python scripts/smoke_translate_docx.py --input tests/fixtures/simple_japanese.docx --output /tmp/smoke_output.docx

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: smoke-artifacts
        path: /tmp/smoke_out/
        retention-days: 7