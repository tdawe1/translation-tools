name: PDF Translation Integration Tests

on:
  push:
    paths: 
      - 'tests/**'
      - 'scripts/**'
      - 'requirements_pdf.txt'
  pull_request:
    paths:
      - 'tests/**'
      - 'scripts/**'
      - 'requirements_pdf.txt'

jobs:
  quality-tests:
    runs-on: ubuntu-latest
    name: Quality Metrics Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements_pdf.txt ]; then pip install -r requirements_pdf.txt; fi
    
    - name: Run quality metrics tests
      run: |
        python -m pytest tests/test_pdf_quality_metrics.py -v --tb=short
    
    - name: Run integration quality tests
      run: |
        python -m pytest tests/test_pdf_integration.py::TestQualityMetricsEnforcement -v --tb=short
    
    - name: Generate coverage report
      run: |
        python -m pytest tests/test_pdf_quality_metrics.py --cov=scripts --cov-report=xml || true
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: pdf-quality
        name: codecov-umbrella
      continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: quality-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock pytest-cov
        if [ -f requirements_pdf.txt ]; then pip install -r requirements_pdf.txt; fi
    
    - name: Generate test data
      run: |
        python tests/create_sample_pdfs.py
    
    - name: Run error scenario tests
      run: |
        python -m pytest tests/test_pdf_integration.py::TestPDFTranslationErrorScenarios -v --tb=short
      continue-on-error: true
    
    - name: Run output generation tests
      run: |
        python -m pytest tests/test_pdf_integration.py::TestPDFTranslationOutputGeneration -v --tb=short
      continue-on-error: true
    
    - name: Run end-to-end tests
      run: |
        python -m pytest tests/test_pdf_integration.py::TestPDFEndToEndTranslation -v --tb=short
      continue-on-error: true

  performance-tests:
    runs-on: ubuntu-latest
    name: Performance Benchmarks
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark
        if [ -f requirements_pdf.txt ]; then pip install -r requirements_pdf.txt; fi
    
    - name: Run performance benchmarks
      run: |
        python -m pytest tests/test_pdf_quality_metrics.py::TestPDFQualityMetrics::test_performance_benchmarks -v --benchmark-only
      continue-on-error: true

  validation:
    runs-on: ubuntu-latest
    name: Test Data Validation
    needs: [quality-tests, integration-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements_pdf.txt ]; then pip install -r requirements_pdf.txt; fi
    
    - name: Generate and validate test data
      run: |
        python tests/create_sample_pdfs.py
        python -m pytest tests/test_pdf_quality_metrics.py::TestPDFIntegrationValidation -v --tb=short
    
    - name: Check test data quality
      run: |
        python -c "
        import json
        from pathlib import Path
        
        # Check sample files exist
        data_dir = Path('tests/data')
        sample_files = ['simple_japanese.txt', 'multi_column_japanese.txt', 'mixed_content_japanese.txt']
        
        for filename in sample_files:
            file_path = data_dir / filename
            if not file_path.exists():
                raise FileNotFoundError(f'Missing sample file: {filename}')
            
            with open(file_path, 'r', encoding='utf-8') as f:
                content = f.read()
                if len(content) < 100:
                    raise ValueError(f'Sample file {filename} too short: {len(content)} chars')
        
        print('✅ All test data validation checks passed')
        "

  summary:
    runs-on: ubuntu-latest
    name: Test Summary
    needs: [quality-tests, integration-tests, performance-tests, validation]
    if: always()
    
    steps:
    - name: Test Summary
      run: |
        echo "## PDF Translation Integration Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Quality Metrics Tests | ${{ needs.quality-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance Tests | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Test Data Validation | ${{ needs.validation.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.quality-tests.result }}" == "success" && "${{ needs.validation.result }}" == "success" ]]; then
          echo "✅ All critical quality checks passed!" >> $GITHUB_STEP_SUMMARY
          exit 0
        else
          echo "❌ Some quality checks failed. Please review the test results." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi